version: '3.8'

services:
  # Database service
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maiello_user
      POSTGRES_PASSWORD: maiello_pass
      POSTGRES_DB: maiello_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./agents/data-orm/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maiello_user -d maiello_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://maiello_user:maiello_pass@postgres:5432/maiello_db
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - app_data:/app/data

  # Development service (alternative to app for development)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://maiello_user:maiello_pass@postgres:5432/maiello_db
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    profiles:
      - dev

  # AI Score Serverless Function (using Node.js for local development)
  ai-score:
    build:
      context: ./agents/ai-score
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://maiello_user:maiello_pass@postgres:5432/maiello_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_SCORE_PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - ai

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./agents/infra-ci/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./agents/infra-ci/nginx/ssl:/etc/nginx/ssl
      - ./uploads:/app/uploads:ro
    depends_on:
      - app
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  app_data:

networks:
  default:
    name: maiello_network